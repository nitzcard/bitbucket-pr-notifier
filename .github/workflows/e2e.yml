name: E2E tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # each test's GIF goes to its e2e-recordings/<test> branch

jobs:
  # Each test in Tests/E2E/Tests.swift runs as its own job, so each gets its own check.
  list:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "tests=$(grep -o 'TestCase(name: "[^"]*"' Tests/E2E/Tests.swift | cut -d'"' -f2 | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  e2e:
    needs: list
    name: ${{ matrix.test }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.list.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ matrix.test }}
        run: ./scripts/e2e.sh "${{ matrix.test }}"

      - name: Upload report and recording
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.test }}
          path: build/e2e-report
          if-no-files-found: ignore

      # Job summaries can't play video, but show GIFs. Each test's branch holds
      # one commit with its latest recording, force-pushed every run.
      - name: Publish the recording
        id: gif
        if: always() && hashFiles(format('build/e2e-report/recordings/{0}.gif', matrix.test)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ matrix.test }}
        run: |
          dir=$(mktemp -d)
          cp "build/e2e-report/recordings/$TEST.gif" "$dir/"
          cd "$dir"
          git init -q -b recording
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Recording of $TEST, run ${{ github.run_id }}"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" "recording:refs/heads/e2e-recordings/$TEST"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && hashFiles('build/e2e-report/summary.md') != ''
        env:
          TEST: ${{ matrix.test }}
          SHA: ${{ steps.gif.outputs.sha }}
        run: |
          {
            cat build/e2e-report/summary.md
            echo
            if [ -n "$SHA" ]; then
              echo "![Recording of $TEST](https://raw.githubusercontent.com/${{ github.repository }}/$SHA/$TEST.gif)"
              echo
            fi
            echo "🎥 **[Download the full-quality report](${{ steps.upload.outputs.artifact-url }})** — open \`index.html\`; click a step's time to jump to it in the video."
          } >> "$GITHUB_STEP_SUMMARY"
